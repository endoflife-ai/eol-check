name: 'EOL Check — end-of-life software gate'
description: 'Fail CI when your stack runs end-of-life software. Auto-detects runtimes, Docker base images and SBOMs; writes enriched SBOMs. Data: endoflife.ai.'
author: 'endoflife.ai'
branding:
  icon: 'alert-octagon'
  color: 'red'

inputs:
  products:
    description: 'Extra products to check, comma-separated as "slug:version" (e.g. "postgresql:14, nodejs:18"). Slugs are endoflife.ai product slugs.'
    required: false
    default: ''
  scan:
    description: 'Auto-detect versions from repo files (.nvmrc, .node-version, .python-version, .ruby-version, go.mod, package.json engines, Dockerfiles). "true" or "false".'
    required: false
    default: 'true'
  sbom:
    description: 'Path(s) to CycloneDX or SPDX JSON SBOM files, comma-separated (e.g. "sbom.cdx.json" from Syft, Trivy or cdxgen). Components resolve by package URL (exact) against endoflife.ai/purl-map.json; untracked components are counted, never guessed. No API calls, no rate limit.'
    required: false
    default: ''
  sbom-output:
    description: 'Write each SBOM back out with lifecycle facts on every component (CycloneDX properties / SPDX annotations in the endoflife: namespace, same schema as the API - https://endoflife.ai/sbom-enrichment.json). A file path for one input, or a directory (trailing slash) for several: <name>.enriched.<ext>. Upload it to Dependency-Track, attach it to a release, or diff it between runs.'
    required: false
    default: ''
  fail-on:
    description: 'When to fail the job: "eol" (something is past end of life), "approaching" (also fail when EOL is within warn-days), or "never" (report only).'
    required: false
    default: 'eol'
  warn-days:
    description: 'Warn (annotate) when a product reaches end of life within this many days.'
    required: false
    default: '90'
  api-key:
    description: 'Optional endoflife.ai API key (free, Starter or Pro; free keys at https://endoflife.ai/api#free-key). Pass it from a secret, e.g. secrets.ENDOFLIFE_API_KEY. With a key, repo and products checks query the live API; without one they resolve from the public endoflife.ai/scanner-db.json (no key, no rate limit), so no setup is needed.'
    required: false
    default: ''

outputs:
  eol-count:
    description: 'Number of detected products already past end of life.'
  approaching-count:
    description: 'Number of detected products reaching end of life within warn-days.'
  checked-count:
    description: 'Total product/version pairs checked (repo scan + products input + SBOM).'
  sbom-components:
    description: 'Total components read from the SBOM file(s), tracked or not.'
  unmatched-count:
    description: 'SBOM components endoflife.ai does not track (no verdict given).'
  report:
    description: 'Markdown report of every finding.'

runs:
  using: 'node20'
  main: 'index.js'
